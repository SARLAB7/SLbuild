<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | SACLAB</title>
    
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">
</head> 
<body>

    <div class="login-container">
    <div class="login-box">
        
        <div id="login-view">
            <header>
                <h1>SACLAB</h1>
                <p>Sistemas de Automatización Contable</p>
            </header>
            
            <form id="login-form">
                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="login-email" placeholder="nombre@empresa.com" required>
                </div>
                
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-primary">Entrar al Sistema</button>
            </form>
            
            <footer>
                <a href="#" id="link-forgot">¿Olvidaste tu contraseña?</a>
            </footer>
        </div>

        <div id="forgot-view" style="display: none;">
            <header>
                <h1>Recuperar</h1>
                <p>Enviaremos un enlace a tu correo para restablecer tu clave.</p>
            </header>
            
            <form id="forgot-form">
                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="forgot-email" placeholder="tu-correo@empresa.com" required>
                </div>
                <button type="submit" class="btn-primary">Enviar Enlace</button>
            </form>
            
            <footer>
                <a href="#" id="link-back-login">Volver al inicio de sesión</a>
            </footer>
        </div>

    </div>
</div>
    <script type="module">
    import { vigilarSesion } from './js/auth.js';

    vigilarSesion(
        () => window.location.href = 'panel.html', // Si ya está logueado, mándalo al panel
        () => console.log("Invitado listo para loguearse") // Si no, deja que vea el login
    );
</script>
    <div id="toast-container" class="toast-container"></div>
<script type="module" src="./js/firebase-config.js"></script>
<script type="module" src="./js/auth.js"></script>
</body>
</html>
