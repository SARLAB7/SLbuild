<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | SACLAB</title>
    
  <!-- 2. Shoelace (Componentes Web Premium) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/themes/light.css" />
    <!-- Agregamos el tema oscuro de Shoelace -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/themes/dark.css" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/shoelace-autoloader.js"></script>

    <!-- 3. Tailwind CSS (Motor de Diseño) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', /* ¡Clave! Esto habilita el modo oscuro manual */
            theme: {
                extend: {
                    colors: {
                        enterprise: {
                            500: '#3b82f6',
                            600: '#2563eb', 
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>

    <!-- 3. Estilos Locales (Limpios y Optimizados) -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen font-sans text-slate-800">

    <!-- Caja Principal de Login centrada por Tailwind -->
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg border border-slate-200 p-8 relative overflow-hidden mx-4">
        
        <!-- Línea superior corporativa (Azul Enterprise) -->
        <div class="absolute top-0 left-0 w-full h-1 bg-enterprise-600"></div>

        <!-- =========================================
             VISTA DE LOGIN
             ========================================= -->
        <div id="login-view">
            <header class="mb-8 text-center">
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight mb-1">SACLAB</h1>
                <p class="text-sm font-medium text-slate-500">Sistemas de Automatización Contable</p>
            </header>
            
            <form id="login-form" class="flex flex-col gap-5">
                
                <!-- Correo -->
                <sl-input id="login-email" type="email" label="Correo Electrónico" placeholder="nombre@empresa.com" required clearable></sl-input>
                
                <!-- Contraseña (Con botón de ojito integrado) -->
                <sl-input id="login-password" type="password" label="Contraseña" placeholder="••••••••" required password-toggle></sl-input>
                
                <!-- Botón de Envío -->
                <sl-button variant="primary" type="submit" size="large" style="width: 100%; margin-top: 4px;">
                    Entrar al Sistema
                </sl-button>
            </form>
            
            <footer class="mt-6 text-center">
                <a href="#" id="link-forgot" class="text-sm font-medium text-enterprise-600 hover:text-enterprise-700 transition-colors">¿Olvidaste tu contraseña?</a>
            </footer>
        </div>

        <!-- =========================================
             VISTA DE RECUPERACIÓN (Oculta por defecto)
             ========================================= -->
        <div id="forgot-view" style="display: none;">
            <header class="mb-8 text-center">
                <h1 class="text-2xl font-bold text-slate-900 mb-1">Recuperar Acceso</h1>
                <p class="text-sm text-slate-500 leading-relaxed">Enviaremos un enlace a tu correo para restablecer tu clave.</p>
            </header>
            
            <form id="forgot-form" class="flex flex-col gap-5">
                <sl-input id="forgot-email" type="email" label="Correo Electrónico" placeholder="tu-correo@empresa.com" required clearable></sl-input>
                
                <sl-button variant="primary" type="submit" size="large" style="width: 100%; margin-top: 4px;">
                    Enviar Enlace
                </sl-button>
            </form>
            
            <footer class="mt-6 text-center">
                <a href="#" id="link-back-login" class="text-sm font-medium text-slate-500 hover:text-slate-800 transition-colors">Volver al inicio de sesión</a>
            </footer>
        </div>

    </div>

    <!-- Scripts de Lógica (Intactos) -->
    <script type="module">
        import { vigilarSesion } from './js/auth.js';

        vigilarSesion(
            () => window.location.href = 'panel.html', // Si ya está logueado, mándalo al panel
            () => console.log("Invitado listo para loguearse") // Si no, deja que vea el login
        );
    </script>
    <div id="toast-container" class="toast-container"></div>
    <script type="module" src="./js/firebase-config.js"></script>
    <script type="module" src="./js/auth.js"></script>

</body>
</html>
