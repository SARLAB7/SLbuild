<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | SACLAB</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/themes/light.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/themes/dark.css" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/shoelace-autoloader.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        // Paleta Morada Elegante
                        enterprise: { 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9' }
                    },
                    animation: { blob: "blob 10s infinite" },
                    keyframes: {
                        blob: {
                            "0%": { transform: "translate(0px, 0px) scale(1)" },
                            "50%": { transform: "translate(20px, -20px) scale(1.1)" },
                            "100%": { transform: "translate(0px, 0px) scale(1)" },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .card-glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 1.5rem;
            box-shadow: 0 10px 40px -10px rgba(124, 58, 237, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-100 transition-colors duration-500">

    <div class="fixed inset-0 z-[-1] overflow-hidden">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-purple-400/30 rounded-full filter blur-[120px] animate-blob"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-blue-400/20 rounded-full filter blur-[120px] animate-blob animation-delay-2000"></div>
    </div>

    <div class="w-full max-w-sm card-glass p-8">
        
        <div id="login-view">
            <header class="mb-8 text-center">
                <h1 class="text-3xl font-black text-slate-900 tracking-tighter mb-1">SAC<span class="text-enterprise-600">LAB</span></h1>
                <p class="text-xs font-semibold text-slate-500 uppercase tracking-widest">Sistemas de Automatización</p>
            </header>
            
            <form id="login-form" class="flex flex-col gap-4">
                <sl-input id="login-email" type="email" label="Correo Electrónico" required clearable></sl-input>
                <sl-input id="login-password" type="password" label="Contraseña" required password-toggle></sl-input>
                
                <sl-button variant="primary" type="submit" size="large" class="w-full mt-2">
                    Entrar al Sistema
                </sl-button>
            </form>
            
            <footer class="mt-6 text-center">
                <a href="#" id="link-forgot" class="text-sm font-medium text-enterprise-600 hover:text-enterprise-700 transition-colors">¿Olvidaste tu contraseña?</a>
            </footer>
        </div>

        <div id="forgot-view" style="display: none;">
            <header class="mb-8 text-center">
                <h1 class="text-2xl font-bold text-slate-900 mb-1">Recuperar Acceso</h1>
                <p class="text-sm text-slate-500">Enviaremos un enlace de restauración a tu correo.</p>
            </header>
            <form id="forgot-form" class="flex flex-col gap-4">
                <sl-input id="forgot-email" type="email" label="Correo Electrónico" required clearable></sl-input>
                <sl-button variant="primary" type="submit" size="large" class="w-full mt-2">Enviar Enlace</sl-button>
            </form>
            <footer class="mt-6 text-center">
                <a href="#" id="link-back-login" class="text-sm font-medium text-slate-500 hover:text-slate-800 transition-colors">Volver al inicio</a>
            </footer>
        </div>
    </div>

    <script type="module">
        // ... (Tu lógica de Auth sigue intacta)
    </script>
</body>
</html>
