<!DOCTYPE html>
<html lang="es" class="dark sl-theme-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | SACLAB</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/themes/light.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/themes/dark.css" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/shoelace-autoloader.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { enterprise: { 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9' } }, animation: { blob: "blob 10s infinite" }, keyframes: { blob: { "0%, 100%": { transform: "translate(0px, 0px) scale(1)" }, "50%": { transform: "translate(20px, -20px) scale(1.1)" } } } } }
        }
    </script>
    
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-slim@2.12.0/tsparticles.slim.bundle.min.js"></script>
    
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="font-sans text-slate-100 min-h-screen flex items-center justify-center p-4 bg-[#030305] transition-colors duration-500">
    
    <div class="fixed inset-0 z-[-2] pointer-events-none opacity-80">
        <div class="absolute top-[-15%] left-[-10%] w-[600px] h-[600px] bg-purple-900/20 rounded-full mix-blend-screen filter blur-[140px]"></div>
        <div class="absolute bottom-[-10%] right-[-5%] w-[500px] h-[500px] bg-enterprise-900/15 rounded-full mix-blend-screen filter blur-[120px]"></div>
    </div>

    <div id="tsparticles" class="fixed inset-0 z-[-1]"></div>

    <div class="w-full max-w-sm card-glass p-8">
        
        <div id="login-view">
            <header class="mb-8 text-center">
                <h1 class="text-3xl font-black text-white tracking-tighter mb-1">SAC<span class="text-enterprise-500">LAB</span></h1>
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Sistemas de Automatización</p>
            </header>
            <form id="login-form" class="flex flex-col gap-4">
                <sl-input id="login-email" type="email" label="Correo Electrónico" required clearable></sl-input>
                <sl-input id="login-password" type="password" label="Contraseña" required password-toggle></sl-input>
                <sl-button variant="primary" type="submit" size="large" class="w-full mt-2">Entrar al Sistema</sl-button>
            </form>
            <footer class="mt-6 text-center">
                <a href="#" id="link-forgot" class="text-sm font-medium text-enterprise-500 hover:text-enterprise-400 transition-colors">¿Olvidaste tu contraseña?</a>
            </footer>
        </div>

        <div id="forgot-view" style="display: none;">
            <header class="mb-8 text-center">
                <h1 class="text-2xl font-bold text-white mb-1">Recuperar Acceso</h1>
                <p class="text-sm text-slate-400">Enviaremos un enlace de restauración a tu correo.</p>
            </header>
            <form id="forgot-form" class="flex flex-col gap-4">
                <sl-input id="forgot-email" type="email" label="Correo Electrónico" required clearable></sl-input>
                <sl-button variant="primary" type="submit" size="large" class="w-full mt-2">Enviar Enlace</sl-button>
            </form>
            <footer class="mt-6 text-center">
                <a href="#" id="link-back-login" class="text-sm font-medium text-slate-400 hover:text-white transition-colors">Volver al inicio</a>
            </footer>
        </div>
    </div>

    <script type="module" src="./js/auth.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            tsParticles.load("tsparticles", {
                background: { color: { value: "transparent" } },
                fpsLimit: 60,
                interactivity: {
                    events: { onHover: { enable: true, mode: "grab" } },
                    modes: { grab: { distance: 180, links: { opacity: 0.3 } } }
                },
                particles: {
                    color: { value: "#8b5cf6" },
                    links: { color: "#ffffff", distance: 150, enable: true, opacity: 0.08, width: 1 },
                    move: { enable: true, speed: 0.6, direction: "none", random: false, straight: false, outModes: { default: "bounce" } },
                    number: { density: { enable: true, area: 800 }, value: 80 },
                    opacity: { value: 0.4 },
                    shape: { type: "circle" },
                    size: { value: { min: 1, max: 2 } }
                },
                detectRetina: true
            });
        });
    </script>
</body>
</html>
