<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARLAB | Automatización Contable</title>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-container">
                <h2>SARLAB</h2>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active"><i data-feather="home"></i> Inicio</a>
                <a href="#" class="nav-item"><i data-feather="file-text"></i> Facturas</a>
                <a href="#" class="nav-item"><i data-feather="pie-chart"></i> Estadísticas</a>
                <a href="#" class="nav-item"><i data-feather="users"></i> Clientes</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    <i data-feather="search"></i>
                    <input type="text" placeholder="Buscar transacciones...">
                </div>
                <div class="user-profile">
                    <button id="theme-toggle" class="icon-btn" title="Cambiar tema">
                        <i data-feather="moon"></i>
                    </button>
                    <button class="icon-btn">
                        <i data-feather="bell"></i>
                    </button>
                    <div class="avatar"></div>
                </div>
            </header>
            
            <section class="summary-cards">
                <div class="card highlight-card">
                    <h3>Balance Total</h3>
                    <h1 class="amount">$786,898.67</h1>
                    <div class="card-footer">
                        <span>**** **** **** 5466</span>
                        <i data-feather="credit-card"></i>
                    </div>
                </div>
                
                <div class="card dark-card">
                    <h3>Ingresos Totales</h3>
                    <h2 class="amount">$67,545.23</h2>
                    <div class="chart-placeholder">Gráfico aquí</div>
                </div>
            </section>
            
            <section class="transactions-section">
                <div class="section-header">
                    <h3>Facturas Recientes</h3>
                    <div class="filter-tabs">
                        <button class="tab active">Todas</button>
                        <button class="tab">Borradores</button>
                        <button class="tab highlight">No Pagadas</button>
                    </div>
                </div>

                <div class="transactions-list" id="transactions-container">
                    <div class="empty-state">
                        <i data-feather="inbox"></i>
                        <p>No hay transacciones registradas aún.</p>
                        <button class="btn-primary" id="btn-nueva-factura">
                            <i data-feather="plus"></i> Crear Factura
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div class="modal-overlay" id="modal-factura" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Registrar Nueva Factura</h2>
                <button id="btn-cerrar-modal" class="icon-btn"><i data-feather="x"></i></button>
            </div>
            
            <form id="form-nueva-factura">
                <div class="input-group">
                    <label>Nombre del Cliente</label>
                    <input type="text" id="factura-cliente" placeholder="Ej. Empresa S.A.S" required>
                </div>
                
                <div class="input-group">
                    <label>Monto Total ($)</label>
                    <input type="number" id="factura-monto" placeholder="0.00" required>
                </div>
                
                <div class="input-group">
                    <label>Estado</label>
                    <select id="factura-estado">
                        <option value="Pagada">Pagada</option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="Borrador">Borrador</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-primary">Guardar en Sistema</button>
            </form>
        </div>
    </div>

   <script>
      feather.replace()
    </script>
    
    <script type="module" src="./js/firebase-config.js"></script>
    <script type="module" src="./js/auth.js"></script>

</body>
</html>
