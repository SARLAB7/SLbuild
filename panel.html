<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACLAB | Automatización Contable</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://unpkg.com/feather-icons"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/themes/light.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/themes/dark.css" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/shoelace-autoloader.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        enterprise: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        :root {
            --sl-input-border-radius-medium: 0.75rem; 
            --sl-button-border-radius-medium: 0.75rem;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .card-clean {
            @apply bg-white dark:bg-[#111827] border border-slate-200 dark:border-white/5 shadow-sm rounded-2xl p-6 transition-colors duration-300;
        }
    </style>
</head>

<body x-data="{ isDark: localStorage.getItem('theme') === 'dark', vistaActiva: 'sec-inicio', menuMovil: false }" 
      x-init="$watch('isDark', val => localStorage.setItem('theme', val ? 'dark' : 'light'))"
      :class="isDark ? 'dark sl-theme-dark' : ''"
      class="bg-slate-50 dark:bg-[#050608] font-sans text-slate-800 dark:text-slate-100 min-h-screen flex flex-col overflow-hidden transition-colors duration-300">
    
    <header class="h-16 glass-header border-b border-slate-200 dark:border-white/5 flex items-center justify-between px-4 md:px-6 z-50 sticky top-0">        
        <div class="flex items-center gap-3">
            <button @click="menuMovil = !menuMovil" class="md:hidden text-slate-600 dark:text-slate-300 p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <div class="logo font-extrabold text-xl tracking-tight text-enterprise-600 dark:text-enterprise-400">SACLAB</div>
        </div>
        
        <nav class="hidden md:flex bg-slate-100/50 dark:bg-slate-800/50 border border-slate-200 dark:border-white/10 rounded-lg px-2 py-1 gap-1">
            <div class="relative" x-data="{ open: false }" @click.away="open = false">
                <button @click="open = !open" class="flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-md hover:bg-white dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors">
                    <span class="material-symbols-outlined text-[18px]">account_balance</span> Finanzas
                </button>
                <div x-show="open" x-transition class="absolute top-full left-0 mt-2 w-40 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-lg p-1 z-50 flex flex-col" style="display: none;">
                    <button @click="vistaActiva = 'sec-inicio'; open = false" class="text-left px-3 py-2 text-sm hover:bg-slate-50 dark:hover:bg-slate-700 rounded-lg">Dashboard</button>
                    <button @click="vistaActiva = 'sec-facturas'; open = false" class="text-left px-3 py-2 text-sm hover:bg-slate-50 dark:hover:bg-slate-700 rounded-lg">Facturación</button>
                    <button @click="vistaActiva = 'sec-gastos'; open = false" class="text-left px-3 py-2 text-sm hover:bg-slate-50 dark:hover:bg-slate-700 rounded-lg">Egresos</button>
                </div>
            </div>
            <div class="relative" x-data="{ open: false }" @click.away="open = false">
                <button @click="open = !open" class="flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-md hover:bg-white dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors">
                    <span class="material-symbols-outlined text-[18px]">business_center</span> Gestión
                </button>
                <div x-show="open" x-transition class="absolute top-full left-0 mt-2 w-40 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-lg p-1 z-50 flex flex-col" style="display: none;">
                    <button @click="vistaActiva = 'sec-clientes'; open = false" class="text-left px-3 py-2 text-sm hover:bg-slate-50 dark:hover:bg-slate-700 rounded-lg">Clientes</button>
                    <button @click="vistaActiva = 'sec-productos'; open = false" class="text-left px-3 py-2 text-sm hover:bg-slate-50 dark:hover:bg-slate-700 rounded-lg">Servicios</button>
                </div>
            </div>
            <div class="relative" x-data="{ open: false }" @click.away="open = false">
                <button @click="open = !open" class="flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-md hover:bg-white dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors">
                    <span class="material-symbols-outlined text-[18px]">receipt_long</span> Contabilidad
                </button>
                <div x-show="open" x-transition class="absolute top-full right-0 mt-2 w-40 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-lg p-1 z-50 flex flex-col" style="display: none;">
                    <button @click="vistaActiva = 'sec-asientos'; open = false" class="text-left px-3 py-2 text-sm hover:bg-slate-50 dark:hover:bg-slate-700 rounded-lg">Libro Diario</button>
                    <button @click="vistaActiva = 'sec-impuestos'; open = false" class="text-left px-3 py-2 text-sm hover:bg-slate-50 dark:hover:bg-slate-700 rounded-lg">DIAN</button>
                </div>
            </div>
        </nav>

        <div class="flex items-center gap-2 md:gap-3">
            <button @click="isDark = !isDark" class="p-2 text-slate-500 hover:text-enterprise-600 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors"><span class="material-symbols-outlined" x-text="isDark ? 'light_mode' : 'dark_mode'"></span></button>
            
            <div class="avatar-container relative">
                <div class="avatar w-9 h-9 rounded-full bg-enterprise-600 text-white flex items-center justify-center font-bold text-sm cursor-pointer border-2 border-transparent hover:border-enterprise-300 transition-colors" id="user-avatar">
                    <span id="avatar-content"></span> 
                </div>
                <div class="avatar-selector hidden absolute top-12 right-0 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-4 shadow-xl z-50 w-48" id="avatar-selector">
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-bold uppercase mb-3">Selecciona un icono</p>
                    <div class="icons-grid flex flex-wrap gap-2">
                        <span class="sel-icon text-slate-600 dark:text-slate-300 hover:text-enterprise-600 cursor-pointer p-1" data-type="icon">person</span>
                        <span class="sel-icon text-slate-600 dark:text-slate-300 hover:text-enterprise-600 cursor-pointer p-1" data-type="icon">account_balance</span>
                        <span class="sel-icon text-slate-600 dark:text-slate-300 hover:text-enterprise-600 cursor-pointer p-1" data-type="icon">monitoring</span>
                        <span class="sel-icon text-slate-600 dark:text-slate-300 hover:text-enterprise-600 cursor-pointer p-1" data-type="icon">shield</span>
                        <span class="sel-icon text-slate-600 dark:text-slate-300 hover:text-enterprise-600 cursor-pointer p-1 font-sans font-bold text-sm flex items-center" data-type="initials" title="Usar mis iniciales">Abc</span>
                    </div>
                    <hr class="my-3 border-slate-100 dark:border-slate-700">
                    <button class="w-full text-left text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 p-2 rounded-lg text-sm flex items-center gap-2 transition-colors" id="btn-logout">
                        <span class="material-symbols-outlined text-[18px]">logout</span> Cerrar Sesión
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div x-show="menu
