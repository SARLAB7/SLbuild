<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACLAB | Automatización Contable</title>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-layout">
   <header class="top-navbar">
    <div class="logo">SACLAB</div>
    <nav class="main-topics">
        <button class="topic-btn active" data-topic="finanzas">
            <i data-feather="dollar-sign"></i> Finanzas
        </button>
        <button class="topic-btn" data-topic="gestion">
            <i data-feather="briefcase"></i> Gestión
        </button>
        <button class="topic-btn" data-topic="legal">
            <i data-feather="file-text"></i> Contabilidad
        </button>
    </nav>
    <div class="user-actions">
        <button id="theme-toggle" class="icon-btn"><i data-feather="moon"></i></button>
        <div class="avatar"></div>
    </div>
</header>

<div class="app-body">
    <aside class="sidebar">
        <nav class="side-nav" id="side-nav-content"></nav>
        
        <a href="#" class="nav-item logout" id="btn-logout">
            <i data-feather="log-out"></i> Cerrar Sesión
        </a>
    </aside>

    <main class="main-content">
        <section id="sec-inicio" class="content-section">
            <h1>Dashboard</h1>
            </section>

       <section id="sec-facturas" class="content-section active-section">
    <header class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h1>Facturas e Ingresos</h1>
        <button class="btn-primary" id="btn-nueva-factura">
            <i data-feather="plus"></i> Crear Factura
        </button>
    </header>

    <div class="kpi-cards-grid">
        <div class="card dark-card">
            <span class="label">Total Por Cobrar</span>
            <h2 class="amount">$172,560.00</h2>
            <div class="card-status badge warning" style="margin-top: 10px;">Vence este mes</div>
        </div>
        <div class="card highlight-card">
            <span class="label">Pagos Recibidos (Mes)</span>
            <h2 class="amount">$67,545.23</h2>
        </div>
        <div class="card dark-card">
            <span class="label">Promedio de Pago</span>
            <h2 class="amount">12 días</h2>
        </div>
        <div class="card dark-card">
            <span class="label">Saldo Vencido</span>
            <h2 class="amount" style="color: var(--status-danger);">$31,211.00</h2>
        </div>
    </div>

    <div class="transactions-section" style="background-color: var(--bg-card); border-radius: var(--radius-lg); padding: 24px; border: 1px solid var(--border-color);">
        <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <h3 style="font-weight: 500;">Facturas Pendientes</h3>
            
            <div class="status-tabs">
                <button class="tab-btn active" data-filter="todas">Todas</button>
                <button class="tab-btn" data-filter="pendientes">Pendientes</button>
                <button class="tab-btn status-pilled" data-filter="borrador">Sin Pagar</button>
            </div>
        </div>

        <div class="transactions-list" id="transactions-container">
            <div class="empty-state" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; color: var(--text-secondary); text-align: center;">
                <i data-feather="inbox" style="width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.5;"></i>
                <p>No hay facturas registradas aún.</p>
                <button class="btn-primary" id="btn-nueva-factura-vacia" style="margin-top: 20px;">
                    <i data-feather="plus"></i> Crear Primera Factura
                </button>
            </div>
        </div>
    </div>
</section>

        <section id="sec-clientes" class="content-section" style="display:none;">
            <h1>Directorio de Clientes</h1>
            </section>
        
        </main>
</div>

    <div class="modal-overlay" id="modal-factura" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Registrar Nueva Factura</h2>
                <button id="btn-cerrar-modal" class="icon-btn"><i data-feather="x"></i></button>
            </div>
            
            <form id="form-nueva-factura">
                <div class="input-group">
                    <label>Nombre del Cliente</label>
                    <input type="text" id="factura-cliente" placeholder="Ej. Empresa S.A.S" required>
                </div>
                
                <div class="input-group">
                    <label>Monto Total ($)</label>
                    <input type="number" id="factura-monto" placeholder="0.00" required>
                </div>
                
                <div class="input-group">
                    <label>Estado</label>
                    <select id="factura-estado">
                        <option value="Pagada">Pagada</option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="Borrador">Borrador</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-primary">Guardar en Sistema</button>
            </form>
        </div>
    </div>

   <script>
      feather.replace()
    </script>
    
    <script type="module" src="./js/firebase-config.js"></script>
    <script type="module" src="./js/auth.js"></script>

</body>
</html>
