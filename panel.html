<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACLAB | Automatización Contable</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://unpkg.com/feather-icons"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/themes/light.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/themes/dark.css" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/shoelace-autoloader.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        enterprise: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        :root {
            --sl-input-border-radius-medium: 0.75rem; 
            --sl-button-border-radius-medium: 0.75rem;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Clase para dar el efecto de profundidad constante */
        .card-depth {
            background: white;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }
        .dark .card-depth {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body x-data="{ isDark: localStorage.getItem('theme') === 'dark', vistaActiva: 'sec-inicio', menuMovil: false }" 
      x-init="$watch('isDark', val => localStorage.setItem('theme', val ? 'dark' : 'light'))"
      :class="isDark ? 'dark sl-theme-dark' : ''"
      class="bg-slate-50 dark:bg-slate-950 font-sans text-slate-800 dark:text-slate-100 min-h-screen flex flex-col overflow-hidden transition-colors duration-300">
    
    <header class="h-16 bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-4 md:px-6 z-50 sticky top-0 transition-colors duration-300">        
        <div class="flex items-center gap-3">
            <button @click="menuMovil = !menuMovil" class="md:hidden text-slate-600 dark:text-slate-300 p-2">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <div class="logo font-extrabold text-xl tracking-tight text-enterprise-600 dark:text-enterprise-400">SACLAB</div>
        </div>
        
        <nav class="hidden md:flex pill-navigation bg-white/50 dark:bg-slate-800/50 backdrop-blur-md border border-white dark:border-slate-700 rounded-lg px-2 py-1 gap-2">
            <div class="nav-group" data-topic="finanzas"><button class="topic-header"><span class="material-symbols-outlined">account_balance</span> <span>Finanzas</span></button></div>
            <div class="nav-group" data-topic="gestion"><button class="topic-header"><span class="material-symbols-outlined">business_center</span> <span>Gestión</span></button></div>
            <div class="nav-group" data-topic="legal"><button class="topic-header"><span class="material-symbols-outlined">receipt_long</span> <span>Contabilidad</span></button></div>
        </nav>

        <div class="flex items-center gap-3">
            <button @click="isDark = !isDark" class="p-2 text-slate-500 hover:text-enterprise-600"><span class="material-symbols-outlined" x-text="isDark ? 'light_mode' : 'dark_mode'"></span></button>
            <button @click="vistaActiva = 'sec-configuracion'" class="p-2 text-slate-500"><span class="material-symbols-outlined">settings</span></button>
            <button class="text-red-500 p-2" id="btn-logout"><span class="material-symbols-outlined">logout</span></button>
        </div>
    </header>

    <div x-show="menuMovil" @click.away="menuMovil = false" x-transition class="fixed top-16 left-0 w-64 h-[calc(100vh-64px)] bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-700 z-50 p-4 shadow-2xl md:hidden">
        <div class="flex flex-col gap-4">
            <button @click="vistaActiva = 'sec-inicio'; menuMovil = false" class="text-left font-bold">Dashboard</button>
            <button @click="vistaActiva = 'sec-facturas'; menuMovil = false" class="text-left font-bold">Facturación</button>
        </div>
    </div>

    <div class="app-body flex flex-1 overflow-hidden">
        <main class="main-content flex-1 overflow-y-auto p-4 md:p-8">            
            
            <section id="sec-inicio" x-show="vistaActiva === 'sec-inicio'" class="card-depth p-6 rounded-2xl">
                <h1 class="text-2xl font-bold mb-6">Dashboard General</h1>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div class="bg-white dark:bg-[#1e293b] p-5 rounded-2xl border border-white dark:border-slate-700 shadow-sm">
                        <p class="text-sm text-slate-500 dark:text-slate-400">Ingresos del Mes</p>
                        <h3 class="text-2xl font-extrabold text-enterprise-600 dark:text-enterprise-400">$4.5M</h3>
                    </div>
                </div>
            </section>

            <section id="sec-facturas" x-show="vistaActiva === 'sec-facturas'" style="display: none;" class="card-depth p-6 rounded-2xl">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold">Gestión de Facturas</h1>
                    <sl-button variant="primary" onclick="document.getElementById('modal-factura').show()">Nueva</sl-button>
                </div>
                <div id="lista-facturas" class="grid gap-4"></div>
            </section>
        </main>
    </div>

    <sl-dialog label="Registrar Nueva Factura" id="modal-factura">
        <form id="form-nueva-factura">
            <sl-input id="factura-cliente" label="Cliente"></sl-input>
            <sl-button variant="primary" type="submit">Guardar</sl-button>
        </form>
    </sl-dialog>

    <script type="module">
        import { vigilarSesion } from './js/auth.js';
        import { activarNavegacionPill, configurarAvatar, inicializarConfiguracion, inicializarFacturacion, inicializarDashboard } from './js/ui.js';
        activarNavegacionPill();
        vigilarSesion(
            (user) => { configurarAvatar(user); inicializarConfiguracion(user); inicializarFacturacion(); inicializarDashboard(); },
            () => window.location.href = 'index.html'
        );
    </script>
</body>
</html>
