<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACLAB | Automatización Contable</title>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-layout">
   <header class="top-navbar">
    <div class="logo">SACLAB</div>
    <nav class="main-topics">
        <button class="topic-btn active" data-topic="finanzas">
            <i data-feather="dollar-sign"></i> Finanzas
        </button>
        <button class="topic-btn" data-topic="gestion">
            <i data-feather="briefcase"></i> Gestión
        </button>
        <button class="topic-btn" data-topic="legal">
            <i data-feather="file-text"></i> Contabilidad
        </button>
    </nav>
    <div class="user-actions">
        <button id="theme-toggle" class="icon-btn"><i data-feather="moon"></i></button>
        <div class="avatar"></div>
    </div>
</header>

<div class="app-body">
    <aside class="sidebar">
        <nav class="side-nav" id="side-nav-content"></nav>
        
        <a href="#" class="nav-item logout" id="btn-logout">
            <i data-feather="log-out"></i> Cerrar Sesión
        </a>
    </aside>

   <main class="main-content">
    
    <section id="sec-inicio" class="content-section">
        <h1 style="margin-bottom: 24px;">Dashboard General</h1>
        </section>

    <section id="sec-facturas" class="content-section" style="display: none;">
        <h1 style="margin-bottom: 24px;">Gestión de Facturas</h1>
        </section>

    <section id="sec-gastos" class="content-section" style="display: none;">
        <h1 style="margin-bottom: 24px;">Registro de Egresos</h1>
        <div class="card dark-card"><p>Módulo de gastos en construcción...</p></div>
    </section>

    <section id="sec-clientes" class="content-section" style="display: none;">
        <h1 style="margin-bottom: 24px;">Directorio de Clientes</h1>
        <div class="card dark-card"><p>Módulo de clientes en construcción...</p></div>
    </section>

    <section id="sec-productos" class="content-section" style="display: none;">
        <h1 style="margin-bottom: 24px;">Servicios Profesionales</h1>
        <div class="card dark-card"><p>Catálogo de servicios en construcción...</p></div>
    </section>

    </main>
</div>

    <div class="modal-overlay" id="modal-factura" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Registrar Nueva Factura</h2>
                <button id="btn-cerrar-modal" class="icon-btn"><i data-feather="x"></i></button>
            </div>
            
            <form id="form-nueva-factura">
                <div class="input-group">
                    <label>Nombre del Cliente</label>
                    <input type="text" id="factura-cliente" placeholder="Ej. Empresa S.A.S" required>
                </div>
                
                <div class="input-group">
                    <label>Monto Total ($)</label>
                    <input type="number" id="factura-monto" placeholder="0.00" required>
                </div>
                
                <div class="input-group">
                    <label>Estado</label>
                    <select id="factura-estado">
                        <option value="Pagada">Pagada</option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="Borrador">Borrador</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-primary">Guardar en Sistema</button>
            </form>
        </div>
    </div>

   <script>
      feather.replace()
    </script>
    
    <script type="module" src="./js/firebase-config.js"></script>
    <script type="module" src="./js/auth.js"></script>

</body>
</html>
